<!DOCTYPE html>
<html>
<head>
<title>SMART Sungai Kupang Admin</title>
<style>
body{font-family:Arial;background:#f7f7f7;padding:30px}
h1{color:#b30000}
table{width:100%;border-collapse:collapse;background:white}
th{background:#c81010;color:white;padding:10px}
td{padding:10px;border:1px solid #ddd}
button{background:#c81010;color:white;padding:10px;border:0}
</style>
</head>
<body>

<h1>SMART Sungai Kupang - Admin Check In</h1>

<button onclick="load()">Refresh</button>

<table>
<thead>
<tr>
<th>No</th>
<th>Nama</th>
<th>KTP</th>
<th>Kamar</th>
<th>Check In</th>
<th>Check Out</th>
<th>Status</th>
</tr>
</thead>
<tbody id="data"></tbody>
</table>

<script>
function load(){

let data=JSON.parse(localStorage.getItem("dataCheckin"))||[];

let html="";

data.forEach((d,i)=>{
html+=`
<tr>
<td>${i+1}</td>
<td>${d.nama}</td>
<td>${d.ktp}</td>
<td>${d.kamar}</td>
<td>${d.tanggalMasuk}</td>
<td>${d.tanggalKeluar}</td>
<td>${d.status}</td>
</tr>`;
});

document.getElementById("data").innerHTML=html;

}

load();
</script>

</body>
</html>
